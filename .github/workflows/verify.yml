name: Verify

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/api
    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/synclab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the sandbox image and the README's minimum.
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/sandbox/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The worker runs this image for every job, so a broken Dockerfile
      # breaks every migration even when the code compiles.
      - run: docker build -t synclab-sandbox:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Drives the dashboard in Chromium against the real API, with throwaway
  # PostgreSQL and Redis containers and a stubbed GitHub (see web/e2e).
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server/api
      - run: npm run db:generate
        working-directory: server/api
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the pull request when it adds a dependency with a known
      # high-severity vulnerability.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # The benchmark fixtures under benchmarks/cases/*/repo pin old majors
          # on purpose: each is the pre-migration version the benchmark was
          # recorded against, and they only run in the throwaway benchmark
          # sandbox. These are every high/critical advisory those lockfiles
          # match (npm audit): path-to-regexp 0.1.12 (express 4), hoek 6 (joi
          # 14), lodash 3, marked 3, nanoid 2 and ws 7.
          allow-ghsas: >-
            GHSA-37ch-88jc-xwx2,
            GHSA-c429-5p7v-vgjp,
            GHSA-jf85-cpcp-j695,
            GHSA-35jh-r3h4-6jhm,
            GHSA-4xc9-xhrj-v574,
            GHSA-p6mc-m468-83gw,
            GHSA-5v2h-r2cx-5xgj,
            GHSA-rrrm-qjm4-v8hf,
            GHSA-28wg-ghj8-5hjv,
            GHSA-2v37-7h3g-55p8,
            GHSA-xwg4-73v4-xw9w,
            GHSA-96hv-2xvq-fx4p
