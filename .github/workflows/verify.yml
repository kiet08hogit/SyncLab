name: Verify

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/api
    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/synclab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the sandbox image and the README's minimum.
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/sandbox/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The worker runs this image for every job, so a broken Dockerfile
      # breaks every migration even when the code compiles.
      - run: docker build -t synclab-sandbox:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Drives the dashboard in Chromium against the real API, with throwaway
  # PostgreSQL and Redis containers and a stubbed GitHub (see web/e2e).
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server/api
      - run: npm run db:generate
        working-directory: server/api
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the pull request when it adds a dependency with a known
      # high-severity vulnerability.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # The express-4-to-5 benchmark fixtures pin express 4.21.2 (and so
          # path-to-regexp 0.1.12) on purpose: it is the pre-migration version
          # the benchmark was recorded against. They only run in the throwaway
          # benchmark sandbox, and server/ and web/ use path-to-regexp 8.x.
          allow-ghsas: GHSA-37ch-88jc-xwx2
