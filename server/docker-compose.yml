version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: synclab-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: synclab
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: synclab-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  pgdata:
